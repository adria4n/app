<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Bitmovin ClearKey</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #my-player {
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js" type="text/javascript"></script>
</head>
<body>

    <div id="my-player"></div>

    <script>
        const params = new URLSearchParams(location.search);
        const url = params.get("url");
        const keyId = params.get("kid");   // Cambiado de "id" a "kid"
        const key = params.get("key");     // Cambiado de "k" a "key"

        const playerConfig = {
            key: "7d215c81-504c-4a3d-b870-f8180f2ce68a",
            playback: {
                autoplay: true,
                muted: false
            }
        };

        const playerContainer = document.getElementById('my-player');
        const player = new bitmovin.player.Player(playerContainer, playerConfig);

        const sourceConfig = {
            dash: url,
            drm: {
                clearkey: [{
                    key: key,
                    kid: keyId
                }]
            }
        };

        player.load(sourceConfig);
    </script>

</body>
</html>
