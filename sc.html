<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizando Señal - Wetflix</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; z-index: 1000; }
        .loading-bars { display: flex; align-items: flex-end; gap: 5px; height: 40px; }
        .bar { width: 6px; height: 10px; background: #e50914; border-radius: 3px; animation: grow 1s ease-in-out infinite; }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes grow { 0%, 100% { height: 10px; opacity: 0.4; } 50% { height: 40px; opacity: 1; } }
        .text { margin-top: 25px; color: #fff; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; text-align: center; padding: 0 16px; }
        .error-msg { color: #ff4d4d; font-weight: bold; }
        #container { width: 100%; height: 100%; display: none; }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="loading-bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div id="status-text" class="text">Sincronizando señal de Wetflix...</div>
    </div>
    <div id="container">
        <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline></video>
    </div>

    <script>
    (function () {
        /** Cambia solo si el PHP vive en otra ruta */
        const PROXY_ENDPOINT = window.location.pathname || '/proxy.php';

        function isProbablyBase64(str) {
            return /^[A-Za-z0-9+/=_-]+$/.test(str) && !/^https?:\/\//i.test(str);
        }

        function decodePageParam(raw) {
            if (!raw) return null;
            const trimmed = raw.trim();
            if (/^https?:\/\//i.test(trimmed)) {
                return trimmed;
            }
            if (isProbablyBase64(trimmed)) {
                try {
                    const normalized = trimmed.replace(/-/g, '+').replace(/_/g, '/');
                    const decoded = atob(normalized);
                    if (/^https?:\/\//i.test(decoded)) return decoded;
                } catch (e) { /* sigue como payload crudo */ }
            }
            return trimmed;
        }

        function buildFetchUrl(pageUrl) {
            const q = new URLSearchParams();
            q.set('action', 'fetch');
            q.set('url', pageUrl);
            return PROXY_ENDPOINT + '?' + q.toString();
        }

        function showError(msg) {
            $('#status-text').addClass('error-msg').text(msg);
        }

        function startPlayer(streamUrl) {
            const player = videojs('my-player');
            player.src({ src: streamUrl, type: 'application/x-mpegURL' });
            player.ready(function () {
                const show = function () {
                    $('#loader').fadeOut(400, function () { $('#container').fadeIn(200); });
                };
                player.play().then(show).catch(show);
            });
        }

        $(function () {
            const params = new URLSearchParams(window.location.search);
            const rawUrl = params.get('url') || params.get('pagina');

            if (!rawUrl) {
                showError('ERROR: FALTA ?url=PAGINA');
                return;
            }

            const pageUrl = decodePageParam(rawUrl);

            $.ajax({
                url: buildFetchUrl(pageUrl),
                type: 'GET',
                dataType: 'json',
                success: function (res) {
                    if (res.status === 'success' && res.url) {
                        startPlayer(res.url);
                    } else {
                        showError('ERROR: ' + (res.message || 'SIN SEÑAL'));
                    }
                },
                error: function () {
                    showError('ERROR DE CONEXIÓN');
                }
            });
        });
    })();
    </script>
</body>
  </html>
