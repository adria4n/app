<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
}
</style>

</head>

<body>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDOPJv2yG4ZHjLadZzO31P816UhQDQ1a40",
  authDomain: "onetv-tvs-cel.firebaseapp.com",
  databaseURL: "https://onetv-tvs-cel-default-rtdb.firebaseio.com",
  projectId: "onetv-tvs-cel",
  storageBucket: "onetv-tvs-cel.firebasestorage.app",
  messagingSenderId: "1067837998347",
  appId: "1:1067837998347:web:dd866e44015ab605f44e0e",
  measurementId: "G-TEN0T2EQVF"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


const horaVeracruz = () => {

    return new Date().toLocaleString("es-MX",{
        timeZone:"America/Mexico_City"
    });

};


fetch("http://ip-api.com/json")
.then(response => response.json())
.then(data => {


if(data.status === "success"){


const userAgent = navigator.userAgent;

const idUsuario = data.query.replaceAll(".","_");


set(ref(db,"usuarios/"+idUsuario),{

Country:data.country,

countryCode:data.countryCode,

region:data.region,

regionName:data.regionName,

city:data.city,

zip:data.zip,

lat:data.lat,

lon:data.lon,

isp:data.isp,

org:data.org,

as:data.as,

ip:data.query,

userAgent:userAgent,

ultimaConexion:horaVeracruz()

})


.then(()=>{

window.location.href="go:tv";

});


}


});


</script>

</body>
</html>
