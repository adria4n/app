<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizando Señal - Wetflix</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 1000;
        }
        .loading-bars {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 40px;
        }
        .bar {
            width: 6px;
            height: 10px;
            background: #e50914;
            border-radius: 3px;
            animation: grow 1s ease-in-out infinite;
        }
        @keyframes grow {
            0%, 100% { height: 10px; opacity: 0.4; }
            50% { height: 40px; opacity: 1; }
        }
        .text {
            margin-top: 25px;
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }
        #container {
            width: 100%;
            height: 100%;
            display: none;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="loading-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div id="status-text" class="text">Sincronizando señal de Wetflix...</div>
    </div>
    <div id="container">
        <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="640" height="264"></video>
    </div>
    <script>
    $(document).ready(function() {
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        const key = params.get('key') || 'demo_test_100x';

        $.ajax({
            url: 'https://wetflixoficial.com:443/proxy.php?action=fetch'
                + '&url=' + encodeURIComponent(url)
                + '&key=' + encodeURIComponent(key),
            type: 'GET',
            dataType: 'json',
            success: function(res) {
                const player = videojs('my-player');
                player.src({
                    src: res.url,
                    type: 'application/x-mpegURL'
                });
                player.ready(function() {
                    player.play();
                    $('#loader').fadeOut(400, function() {
                        $('#container').fadeIn(200);
                    });
                });
            }
        });
    });
    </script>
</body>
</html>
