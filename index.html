<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor Bitmovin ClearKey</title>

<link rel="stylesheet" href="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.css">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    #player {
        width: 100%;
        height: 100%;
    }
</style>

<script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>

<script>
(function () {
  var fakeLicense = 'data:text/plain;charset=utf-8;base64,eyJzdGF0dXMiOiJncmFudGVkIiwibWVzc2FnZSI6IlRoZXJlIHlvdSBnby4ifQ==';
  var originalOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function () {
    if (arguments[1] && arguments[1].indexOf('licensing.bitmovin.com') > -1) {
      arguments[1] = fakeLicense;
    }
    return originalOpen.apply(this, arguments);
  };
})();
</script>
</head>
<body>

<div id="player"></div>

<script>
const params = new URLSearchParams(location.search);
const url = params.get("url");
const keyId = params.get("id");
const key = params.get("k");

const playerConfig = {
    key: "c275421b-860d-4361-b2a6-0d92c945e2f3",
    playback: {
        autoplay: true,
        muted: false
    },
    ui: {
        enable: true
    }
};

const container = document.getElementById('player');
const player = new bitmovin.player.Player(container, playerConfig);

const sourceConfig = {
    dash: url,
    drm: {
        clearkey: [{
            kid: keyId,
            key: key
        }]
    }
};

player.load(sourceConfig);
</script>

</body>
</html>
