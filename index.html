<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor JW ClearKey</title>

<style>
html,body{
margin:0;
padding:0;
background:#000;
width:100%;
height:100%;
overflow:hidden;
}
#player{
width:100%;
height:100%;
}
</style>

<script src="https://ssl.p.jwpcdn.com/player/v/8.26.4/jwplayer.js"></script>
<script>
jwplayer.key="XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";
</script>
</head>
<body>

<div id="player"></div>

<script>
const params=new URLSearchParams(location.search);
const url=params.get("url");
const keyId=params.get("id");
const key=params.get("k");

jwplayer("player").setup({
playlist:[{
sources:[{
type:"dash",
file:url,
drm:{
clearkey:{
keyId:keyId,
key:key
}
},
label:"Auto"
}]
}],
width:"100%",
height:"100%",
stretching:"fit",
autostart:true,
mute:false,
controls:true,
skin:{
name:"glow"
},
logo:{
file:"",
position:"top-right"
}
});
</script>

</body>
</html>
