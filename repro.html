<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Shaka Player ClearKey</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.3/shaka-player.compiled.js"></script>
</head>

<body>

    <video id="video" autoplay controls playsinline></video>

    <script>
        const params = new URLSearchParams(window.location.search);

        const url = params.get("url");
        const kid = params.get("kid");
        const key = params.get("key");

        async function initPlayer() {
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                return;
            }

            const video = document.getElementById("video");
            video.autoplay = true;
            video.muted = false;

            const player = new shaka.Player(video);

            player.configure({
                drm: {
                    clearKeys: (kid && key) ? {
                        [kid]: key
                    } : {}
                }
            });

            try {
                await player.load(url);
                await video.play().catch(() => {});
            } catch (error) {
                console.error(error);
            }
        }

        initPlayer();
    </script>

</body>

</html>
