<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor Bitmovin ClearKey</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
#player {
    width: 100%;
    height: 100%;
}
</style>

<!-- Bitmovin Player -->
<script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>
</head>
<body>

<div id="player"></div>

<script>
const params = new URLSearchParams(location.search);
const url = params.get("url");
const keyId = params.get("id");
const key = params.get("k");

// Tu clave de licencia de Bitmovin
const playerKey = "c275421b-860d-4361-b2a6-0d92c945e2f3";

if (!url || !keyId || !key) {
    console.error("Faltan parámetros: url, id o k");
}

// Configuración del reproductor
const playerConfig = {
    key: playerKey,
    playback: {
        autoplay: true,
        muted: false
    },
    ui: {
        // Puedes personalizar la UI si quieres
    }
};

// Crear el reproductor
const container = document.getElementById('player');
const player = new bitmovin.player.Player(container, playerConfig);

// Configuración de la fuente con ClearKey
const sourceConfig = {
    dash: url,
    drm: {
        clearkey: [{
            kid: keyId,
            key: key
        }]
    }
};

// Cargar la fuente
player.load(sourceConfig).then(() => {
    console.log("Reproducción iniciada correctamente");
}).catch(error => {
    console.error("Error al cargar el video:", error);
});
</script>

</body>
</html>
